name: Build Desktop

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach binaries to (leave empty to only produce artifacts)'
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            patchelf libgtk-3-bin libglib2.0-bin librsvg2-bin \
            desktop-file-utils file

      - name: Build Linux bundle
        working-directory: frontend
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package AppImage
        working-directory: frontend
        run: |
          set -euo pipefail

          BUNDLE=build/linux/x64/release/bundle
          APP_DIR=AppDir
          DIST=../dist

          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin" "$APP_DIR/usr/share" "$DIST"

          # Flutter resolves data/ and lib/ relative to the executable.
          cp -a "$BUNDLE/PrimePlot" "$BUNDLE/lib" "$BUNDLE/data" "$APP_DIR/usr/bin/"
          cp -a "$BUNDLE/share/." "$APP_DIR/usr/share/"

          # linuxdeploy moves the engine and plugins to usr/lib and rewrites the
          # engine's RUNPATH to $ORIGIN. The Rust bridge is dlopen'd by name, so
          # it must be present there too.
          mkdir -p "$APP_DIR/usr/lib"
          cp -a "$BUNDLE/lib/librust_lib_frontend.so" "$APP_DIR/usr/lib/"

          curl -fsSL -o /tmp/linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          curl -fsSL -o /tmp/linuxdeploy-plugin-gtk \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/7a3fbc31a9e5075073ff8790f26effbac5f84453/linuxdeploy-plugin-gtk.sh
          chmod +x /tmp/linuxdeploy /tmp/linuxdeploy-plugin-gtk
          export PATH="/tmp:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          # linuxdeploy's bundled strip cannot handle newer ELF sections
          # (e.g. .relr.dyn) and aborts before setting RUNPATHs.
          export NO_STRIP=1

          linuxdeploy --appdir "$APP_DIR" --plugin gtk \
            --executable "$APP_DIR/usr/bin/PrimePlot" \
            --desktop-file "$APP_DIR/usr/share/applications/com.primeplot.frontend.desktop" \
            --icon-file "$APP_DIR/usr/share/icons/hicolor/512x512/apps/com.primeplot.frontend.png" \
            --output appimage

          mv PrimePlot-x86_64.AppImage "$DIST/PrimePlot-linux-x86_64.AppImage"
          ls -lh "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/PrimePlot-linux-x86_64.AppImage
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 zip
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows bundle
        working-directory: frontend
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release

      - name: Stage bundle and runtime DLLs
        working-directory: frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $src = 'build\windows\x64\runner\Release'
          $dest = '..\dist\PrimePlot'

          if (-not (Test-Path "$src\PrimePlot.exe")) {
            throw "Missing build output: $src\PrimePlot.exe"
          }

          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$src\*" $dest -Recurse -Force

          # Prefer the MSVC redistributable matching the compiler; fall back to
          # the copies already installed on the runner.
          $crtDir = $null
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if ($vsPath) {
              $redist = Join-Path $vsPath 'VC\Redist\MSVC'
              $crtDir = Get-ChildItem $redist -Directory -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending |
                ForEach-Object {
                  Get-ChildItem (Join-Path $_.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue
                } |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }

          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $source = if ($crtDir) { Join-Path $crtDir $dll } else { $null }
            if (-not $source -or -not (Test-Path $source)) {
              $source = Join-Path $env:SystemRoot "System32\$dll"
            }
            if (-not (Test-Path $source)) {
              throw "Could not find $dll"
            }
            Copy-Item $source $dest -Force
          }

          Compress-Archive -Path $dest -DestinationPath '..\dist\PrimePlot-windows-x64.zip' `
            -CompressionLevel Optimal -Force
          Get-ChildItem '..\dist' | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/PrimePlot-windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }} dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure target architecture
        working-directory: frontend
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            flutter config --enable-macos-arm64-only
          else
            flutter config --no-enable-macos-arm64-only
            # Flutter has no per-arch flag for Intel builds; exclude arm64 so
            # the app is x86_64-only instead of a universal binary.
            echo 'EXCLUDED_ARCHS = arm64' >> macos/Runner/Configs/Release.xcconfig
          fi

      - name: Build macOS app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package DMG
        working-directory: frontend
        run: |
          set -euo pipefail

          if [ "${{ matrix.arch }}" = "x64" ]; then
            git checkout -- macos/Runner/Configs/Release.xcconfig
          fi

          APP=build/macos/Build/Products/Release/PrimePlot.app
          BIN="$APP/Contents/MacOS/PrimePlot"
          ARCHS="$(lipo -archs "$BIN")"
          echo "Built architecture(s): $ARCHS"

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            [ "$ARCHS" = "arm64" ] || { echo "Expected arm64, got: $ARCHS"; exit 1; }
          else
            [ "$ARCHS" = "x86_64" ] || { echo "Expected x86_64, got: $ARCHS"; exit 1; }
          fi

          mkdir -p ../dist/dmg
          cp -R "$APP" ../dist/dmg/
          ln -s /Applications ../dist/dmg/Applications
          hdiutil create -volname "PrimePlot" -srcfolder ../dist/dmg -ov -format UDZO \
            "../dist/PrimePlot-macos-${{ matrix.arch }}.dmg"
          rm -rf ../dist/dmg
          ls -lh ../dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/PrimePlot-macos-${{ matrix.arch }}.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach binaries to release
    needs: [linux, windows, macos]
    if: github.event_name == 'release' || inputs.release_tag != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          ls -lh dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
